name: Instagram の鍵を更新

# Instagram の鍵は60日で切れるので、月に2回のばして Secrets に入れ直す
on:
  schedule:
    - cron: '17 0 1,15 * *'
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 更新する
        env:
          GH_TOKEN: ${{ secrets.SECRETS_WRITE_TOKEN }}
          REPO: ${{ github.repository }}
          CONFA_IG_ACCESS_TOKEN: ${{ secrets.CONFA_IG_ACCESS_TOKEN }}
          PLUGRIG_IG_ACCESS_TOKEN: ${{ secrets.PLUGRIG_IG_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then echo "SECRETS_WRITE_TOKEN が未設定"; exit 1; fi
          fail=0
          for name in CONFA_IG_ACCESS_TOKEN PLUGRIG_IG_ACCESS_TOKEN; do
            tok="${!name:-}"
            if [ -z "$tok" ]; then echo "$name: 未設定なので飛ばす"; continue; fi
            res=$(curl -sS "https://graph.instagram.com/refresh_access_token?grant_type=ig_refresh_token&access_token=${tok}")
            new=$(echo "$res" | jq -r '.access_token // empty')
            if [ -z "$new" ]; then echo "$name: 更新失敗 $(echo "$res" | jq -c '.error // .')"; fail=1; continue; fi
            echo "::add-mask::$new"
            gh secret set "$name" --repo "$REPO" --body "$new"
            echo "$name: 更新した（残り $(echo "$res" | jq -r '.expires_in') 秒）"
          done
          exit $fail
